name: cardmine

services:
  app:
    build: ./app
    image: cardmine-app:0.1.0
    container_name: cardmine-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      CARDMINE_DATA_DIR: /data
      ANKI_CONNECT_URL: http://anki-connect-server:8765/api
      # 同步前备份 Anki 集合与媒体，只读访问容器数据目录
      ANKI_DATA_DIR: /anki-data
    volumes:
      - "${APP_DATA_PATH:-./data/app}:/data"
      - "${ANKI_DATA_PATH:-./data/anki}:/anki-data:ro"
    depends_on:
      - anki-connect-server

  anki-connect-server:
    image: glechic/anki-connect-server:v0.5.0
    container_name: cardmine-anki
    restart: unless-stopped
    environment:
      ANKICONNECT_COLLECTION_PATH: /data/anki/collection.anki2
      ANKICONNECT_PORT: "8765"
      # 容器内必须监听 0.0.0.0，主应用才能跨容器访问；不映射宿主机端口
      ANKICONNECT_BIND: 0.0.0.0
      ANKICONNECT_ANKIWEB_USER: ${ANKIWEB_USER:-}
      ANKICONNECT_ANKIWEB_PASS: ${ANKIWEB_PASS:-}
      ANKICONNECT_FAIL_ON_FULL_SYNC_CONFLICT: ${ANKI_FAIL_ON_FULL_SYNC_CONFLICT:-false}
    volumes:
      - "${ANKI_DATA_PATH:-./data/anki}:/data/anki"
