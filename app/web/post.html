<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cardmine · 面经详情</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/vendor/highlight-github.min.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">CM</span>
      <div>
        <h1>cardmine</h1>
        <p>面经闪卡管理台</p>
      </div>
    </div>
    <nav class="nav">
      <a href="/">仪表盘</a>
      <a href="/cards">卡片</a>
      <a href="/posts" class="active">面经</a>
      <a href="/review">审核</a>
      <a href="/import">导入</a>
      <a href="/export">导出</a>
      <a href="/settings">设置</a>
    </nav>
  </header>

  <main class="post-layout">
    <section class="panel">
      <a class="back-link" href="/posts">← 返回面经</a>
      <h2 id="post-title">加载中…</h2>
      <p class="post-meta" id="post-meta"></p>
      <div class="mention-list" id="mention-list"></div>
    </section>

    <section class="panel clean-panel">
      <h2>原文</h2>
      <article class="markdown-body" id="clean-body"></article>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/common.js"></script>
  <script src="/static/vendor/markdown-it.min.js"></script>
  <script src="/static/vendor/highlight.min.js"></script>
  <script src="/static/post.js"></script>
</body>
</html>
