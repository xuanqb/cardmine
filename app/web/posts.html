<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cardmine · 面经</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar-brand">
        <a href="/" class="brand-link">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="10" rx="2"/><path d="M7 19h12a2 2 0 0 0 2-2V9"/></svg>
          </span>
          <div class="brand-text">
            <h1>cardmine</h1>
            <p>面经闪卡工作台</p>
          </div>
        </a>
        <button type="button" class="sidebar-close" id="sidebar-close" aria-label="关闭导航">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group">
          <span class="nav-group-label">工作台</span>
          <a href="/" class="nav-item" data-label="仪表盘">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>
            <span class="nav-label">仪表盘</span>
          </a>
          <a href="/cards" class="nav-item" data-label="卡片库">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4.5-9 4.5-9-4.5Z"/><path d="m3 11.5 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></svg>
            <span class="nav-label">卡片库</span>
          </a>
          <a href="/posts" class="nav-item active" data-label="面经库">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
            <span class="nav-label">面经库</span>
          </a>
          <a href="/review" class="nav-item" data-label="重复审核">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
            <span class="nav-label">重复审核</span>
          </a>
        </div>

        <div class="nav-group">
          <span class="nav-group-label">工具与系统</span>
          <a href="/import" class="nav-item" data-label="导入数据">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span class="nav-label">导入数据</span>
          </a>
          <a href="/export" class="nav-item" data-label="导出备份">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span class="nav-label">导出备份</span>
          </a>
          <a href="/settings" class="nav-item" data-label="系统设置">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="2" y1="14" x2="6" y2="14"/><line x1="10" y1="8" x2="14" y2="8"/><line x1="18" y1="16" x2="22" y2="16"/></svg>
            <span class="nav-label">系统设置</span>
          </a>
        </div>
      </nav>

      <div class="sidebar-footer">
        <a href="/import" class="sidebar-footnote">
          <span>粘贴旧面经</span>
          <span>→</span>
        </a>
      </div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="app-main">
      <header class="mobile-bar">
        <button type="button" class="mobile-menu-btn" id="sidebar-toggle" aria-label="打开导航" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        </button>
        <span class="mobile-title">cardmine</span>
        <span class="mobile-sub">面经库</span>
      </header>

      <main class="workspace">
        <div class="page-header">
          <div>
            <h1 class="page-title">面经库</h1>
            <p class="page-desc">管理 RSS 订阅源、触发采集并查看 AI 切题拆解结果。</p>
          </div>
          <div class="page-actions">
            <button class="ghost" id="feed-manage">来源管理</button>
            <button id="fetch-run">立即抓取</button>
          </div>
        </div>

        <section class="panel">
          <div class="list-toolbar" style="margin-bottom: 14px;">
            <input type="search" id="search" placeholder="搜索面经标题…" autocomplete="off">
            <select id="feed-filter" aria-label="按来源筛选">
              <option value="">全部来源</option>
            </select>
            <select id="ai-filter" aria-label="按切题状态筛选">
              <option value="">全部状态</option>
              <option value="done">已切题</option>
              <option value="pending">待处理</option>
              <option value="failed">失败</option>
            </select>
          </div>

          <section class="feed-panel" id="feed-panel" hidden>
            <div class="panel-head">
              <h2>来源管理</h2>
              <div class="feed-head-actions">
                <button class="ghost" id="group-create">新建组</button>
                <button class="ghost" id="feed-close">收起</button>
              </div>
            </div>
            <p class="hint">
              每个来源指定一个目标组，新面经只在该组内切题与去重。抓取仍由「立即抓取」统一执行。
            </p>
            <form class="feed-form" id="feed-form">
              <input type="url" id="feed-url" placeholder="RSS 地址（https://…）" required>
              <input type="text" id="feed-name" placeholder="备注名（可选）" maxlength="40">
              <select id="feed-group" aria-label="目标组">
                <option value="">未分组</option>
              </select>
              <input type="number" id="feed-interval" value="60" min="5" step="5"
                     aria-label="抓取间隔（分钟）">
              <button type="submit" id="feed-submit">添加来源</button>
              <button type="button" class="ghost" id="feed-cancel" hidden>取消编辑</button>
            </form>
            <div class="feed-list" id="feed-list"></div>
          </section>

          <div class="progress-wrap" id="fetch-progress" hidden>
            <div class="progress-head">
              <span id="fetch-phase">—</span>
              <span id="fetch-count"></span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="fetch-fill"></div>
            </div>
          </div>

          <p class="hint" id="fetch-summary" hidden></p>

          <div class="post-list" id="post-list"></div>

          <div class="pager">
            <button class="ghost" id="prev" disabled>上一页</button>
            <span class="pager-info" id="page-info">—</span>
            <button class="ghost" id="next" disabled>下一页</button>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/static/common.js"></script>
  <script src="/static/posts.js"></script>
</body>
</html>
