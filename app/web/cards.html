<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cardmine · 卡片</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">CM</span>
      <div>
        <h1>cardmine</h1>
        <p>面经闪卡管理台</p>
      </div>
    </div>
    <nav class="nav">
      <a href="/">仪表盘</a>
      <a href="/cards" class="active">卡片</a>
      <a href="/posts">面经</a>
      <a href="/review">审核</a>
      <a href="/import">导入</a>
      <a href="/export">导出</a>
      <a href="/settings">设置</a>
    </nav>
  </header>

  <main class="cards-layout">
    <aside class="panel tree-panel">
      <h2>目录</h2>
      <button class="tree-item tree-all active" id="tree-all">
        <span>全部卡片</span>
      </button>
      <div class="module-tree" id="module-tree"></div>
    </aside>

    <section class="panel list-panel">
      <div class="list-toolbar">
        <input type="search" id="search" placeholder="搜索正面或背面…" autocomplete="off">
        <div class="status-filter" id="status-filter" role="group" aria-label="按状态筛选">
          <button type="button" class="chip active" data-status="">全部</button>
          <button type="button" class="chip" data-status="draft">草稿</button>
          <button type="button" class="chip" data-status="ready">已整理</button>
          <button type="button" class="chip" data-status="archived">已归档</button>
        </div>
        <select id="sort">
          <option value="updated_desc">按更新时间</option>
          <option value="mentions_desc">按出现次数</option>
          <option value="recent_desc">按最近出现</option>
        </select>
        <button type="button" class="ghost" id="merge-button" disabled>合并所选</button>
      </div>

      <div class="card-list" id="card-list"></div>

      <div class="pager">
        <button class="ghost" id="prev" disabled>上一页</button>
        <span class="pager-info" id="page-info">—</span>
        <button class="ghost" id="next" disabled>下一页</button>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="merge-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="merge-title">
      <h2 id="merge-title">合并所选卡片</h2>
      <p class="modal-hint">
        选择一张作为保留卡，其余卡片的背面与问法会并入，随后被删除。保留卡保持原有状态。
      </p>
      <div class="merge-choice-list" id="merge-card-list"></div>
      <div class="merge-options" id="merge-options"></div>
      <div class="merge-warnings" id="merge-warnings"></div>
      <div class="modal-actions">
        <button type="button" class="ghost" id="merge-cancel">取消</button>
        <button type="button" id="merge-confirm">确认合并</button>
      </div>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/cards.js"></script>
</body>
</html>
